<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Summer Fridays Hero</title>
    <link href="styles.css" rel="stylesheet" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <!-- HERO -->
    <header>
      <nav>
      </nav>

      <div class="hero-content">
        <h2>Illuminate your lips with <span class="script">cherry</span></h2>
        <p>
          Your holiday sparkle starts here. Spread smiles and shine by putting
          Summer Fridays’ lip glosses under the Christmas tree.
        </p>
        <button data-modal-target="#modal" class="btn">SHOP NOW →</button>
      </div>


    <!-- MODAL -->
    <div class="modal" id="modal">
      <div class="modal-header">
        <div class="title">Holiday Trio</div>
        <button data-close-button class="close-button">&times;</button>
      </div>
      <div class="modal-body">
        Two limited-edition festive glosses and one bestselling balm — the perfect
        gift to illuminate your lips this holiday season.
      </div>
    </div>
    <div id="overlay"></div>
  </body>
</html>
